<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer id="contacts" style="background:#22252D;color:#FFFFFF;font-family:Inter, sans-serif">
<div style="box-sizing:border-box;max-width:1344px;margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px 24px">
<div style="display:flex;flex-direction:column;gap:32px">
<a href="#" aria-label="Perspektyva Group, головна" style="display:flex;align-self:flex-start;color:#FFFFFF;text-decoration:none;border-radius:8px;outline:none" style-focus="box-shadow:0 0 0 2px #FDC100">
<dc-import name="Logo" hint-size="300px,56px"></dc-import>
</a>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px">
<a href="tel:+380677774070" style="display:flex;align-items:center;gap:12px;color:#FFFFFF;font-weight:600;font-size:20px;line-height:28px;text-decoration:none;white-space:nowrap;border-radius:4px;outline:none" style-hover="text-decoration:underline" style-focus="box-shadow:0 0 0 2px #FDC100">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FDC100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
<span>+380 (67) 777-40-70</span>
</a>
<div style="display:flex;gap:8px">
<a href="#" aria-label="Facebook" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;outline:none;transition:background-color 200ms cubic-bezier(0.2,0,0,1)" style-hover="background-color:#3A3E48" style-focus="box-shadow:0 0 0 2px #FDC100">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FDC100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
</a>
<a href="#" aria-label="Instagram" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;outline:none;transition:background-color 200ms cubic-bezier(0.2,0,0,1)" style-hover="background-color:#3A3E48" style-focus="box-shadow:0 0 0 2px #FDC100">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FDC100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><path d="M17.5 6.5h.01"></path></svg>
</a>
</div>
</div>
</div>
<div style="display:flex;flex-direction:column;align-items:{{ align }};gap:24px">
<nav aria-label="Навігація у футері" style="display:flex;flex-wrap:wrap;justify-content:{{ align }};gap:16px 32px">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="5">
<a href="{{ item.href }}" style="color:#FFFFFF;font-weight:400;font-size:18px;line-height:28px;text-decoration:none;text-underline-offset:8px;white-space:nowrap;border-radius:4px;outline:none" style-hover="text-decoration:underline" style-focus="box-shadow:0 0 0 2px #FDC100">{{ item.label }}</a>
</sc-for>
</nav>
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:{{ align }};gap:8px 12px">
<a href="#" style="color:#9DA2AC;font-size:14px;line-height:20px;text-decoration:none;text-underline-offset:4px;border-radius:4px;outline:none" style-hover="text-decoration:underline;color:#FFFFFF" style-focus="box-shadow:0 0 0 2px #FDC100">Політика конфіденційності</a>
<span aria-hidden="true" style="width:1px;height:16px;background:#3A3E48"></span>
<a href="#" style="color:#9DA2AC;font-size:14px;line-height:20px;text-decoration:none;text-underline-offset:4px;border-radius:4px;outline:none" style-hover="text-decoration:underline;color:#FFFFFF" style-focus="box-shadow:0 0 0 2px #FDC100">Умови використання</a>
</div>
</div>
</div>
<div style="display:flex;justify-content:flex-end">
<button type="button" onClick="{{ toTop }}" aria-label="Нагору" style="display:flex;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer;outline:none;transition:background-color 200ms cubic-bezier(0.2,0,0,1)" style-hover="background-color:#3A3E48" style-focus="box-shadow:0 0 0 2px #FDC100">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FDC100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 11-5-5-5 5"></path><path d="m17 18-5-5-5 5"></path></svg>
</button>
</div>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;400px&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440 };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const m = this.state.w < 768;
    const stacked = this.state.w < 1200;
    return {
      pad: m ? '64px 16px 32px' : '64px 32px 32px',
      align: stacked ? 'flex-start' : 'flex-end',
      toTop: () => {
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
      },
      nav: [
        { label: 'Про компанію', href: '#about' },
        { label: 'Проєкти', href: '#projects' },
        { label: 'Блог', href: '#blog' },
        { label: 'FAQ', href: '#faq' },
        { label: 'Контакти', href: '#contacts' }
      ]
    };
  }
}
</script>
</body>
</html>
